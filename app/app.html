<title>Offertplattform Unterhaltsreinigung</title>
<meta name="theme-color" content="#1b8384">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
/* ===== Clean Service App-Layout v1 =====
   Gerüst: Icon-Leiste links (Desktop) · Topbar mit Menü-Knopf (Handy) · Seitenkopf Eisblau mit Welle
   Seitentypen: Dashboard «Heute zu tun» · Liste mit Detail-Panel von rechts · Formular einspaltig mit Abschnitten */
:root{
  --cs-bg:#ffffff; --cs-bg-soft:#f6fafb; --cs-surface:#ffffff; --cs-head:#eef7f8; --cs-line:#dcebee; --cs-line-strong:#c5dde1;
  --cs-fg:#3c3c3b; --cs-fg-2:#767676; --cs-brand:#2bb6b7; --cs-brand-text:#1b8384; --cs-brand-dark:#187778;
  --cs-rail:#1b8384; --cs-rail-fg:rgba(255,255,255,.72); --cs-rail-active:rgba(255,255,255,.16);
  --cs-mint-bg:rgba(96,190,179,.22); --cs-aqua-bg:rgba(113,182,198,.22); --cs-taube-bg:rgba(152,194,209,.3);
  --cs-warn:#b7641f; --cs-warn-bg:rgba(224,160,58,.18); --cs-err:#b8453c; --cs-err-bg:rgba(200,85,75,.12);
  --cs-scrim:rgba(31,42,43,.32); --cs-shadow:0 18px 50px -24px rgba(27,131,132,.45);
  --cs-radius:10px; --cs-radius-lg:16px;
  --cs-font:"Brandon Text","Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --cs-head-font:"Brandon Grotesque","Figtree",system-ui,sans-serif;
  --rail-w:76px; --topbar-h:56px;
  color-scheme:light; /* Clean-Service-Apps sind bewusst immer hell (Markenbild: weiss, frisch) */
}

*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
[hidden]{display:none!important}
body{background:var(--cs-bg);color:var(--cs-fg);font-family:var(--cs-font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0} h1,h2,h3{margin:0;font-family:var(--cs-head-font);text-wrap:balance}
:focus-visible{outline:2px solid var(--cs-brand-text);outline-offset:2px}

/* ---- Gerüst ---- */
.app{display:flex;min-height:100%}
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail-w);background:var(--cs-rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 16px;z-index:20}
.signet{width:50px;height:50px;border-radius:14px;background:#fff;display:grid;place-items:center;margin-bottom:14px}
.signet img{width:30px;height:auto;display:block}
.logo-full{width:160px;height:auto;display:block}
.nav-i{width:64px;border:0;background:transparent;color:var(--cs-rail-fg);border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:10.5px;font-weight:500;transition:background .18s ease-out,color .18s ease-out}
.nav-i svg{width:22px;height:22px}
.nav-i:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-i[aria-current="page"]{background:var(--cs-rail-active);color:#fff}
.rail .spacer{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:#9ad3d3;color:#1f2a2b;display:grid;place-items:center;font-weight:600;font-size:13px}
.main{flex:1;min-width:0;margin-left:var(--rail-w)}
.topbar{display:none}

/* ---- Seitenkopf ---- */
.phead{position:relative;overflow:hidden;background:var(--cs-head);border-bottom:1px solid var(--cs-line)}
.phead .inner{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:26px 32px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cs-brand-text);font-weight:600}
.phead h1{margin-top:6px;font-weight:300;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(26px,3vw,34px);line-height:1.1;color:var(--cs-brand-text)}
.phead .sub{margin-top:6px;color:var(--cs-fg-2);font-size:14.5px}
.wave{position:absolute;right:0;bottom:0;width:min(560px,70%);height:100%;pointer-events:none}
.content{max-width:1200px;margin:0 auto;padding:24px 32px 48px}

/* ---- Komponenten ---- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 16px;min-height:42px;border:1px solid transparent;font-weight:600;font-size:14.5px;cursor:pointer;transition:background .18s ease-out,transform .12s ease-out,border-color .18s ease-out}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-p{background:#1b8384;color:#fff}.btn-p:hover{background:#187778}
.btn-s{background:var(--cs-surface);border-color:var(--cs-line-strong);color:var(--cs-brand-text)}.btn-s:hover{background:var(--cs-bg-soft)}
.btn-g{background:transparent;color:var(--cs-brand-text);padding-inline:10px}.btn-g:hover{background:var(--cs-bg-soft)}
.card{background:var(--cs-surface);border:1px solid var(--cs-line);border-radius:var(--cs-radius-lg)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:16px;font-weight:600;font-family:var(--cs-font)}
.muted{color:var(--cs-fg-2)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;color:var(--cs-fg)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.b-ok{background:var(--cs-mint-bg)} .b-info{background:var(--cs-aqua-bg)} .b-warn{background:var(--cs-warn-bg)} .b-err{background:var(--cs-err-bg)} .b-neutral{background:var(--cs-taube-bg)}
.num{font-variant-numeric:tabular-nums}

/* Dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.todo{list-style:none;margin:0;padding:0 8px 8px}
.todo li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;transition:background .18s ease-out,opacity .3s ease-out}
.todo li:hover{background:var(--cs-bg-soft)}
.todo .ic{width:40px;height:40px;flex:0 0 auto}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-weight:600;font-size:14.5px}
.todo .tx small{color:var(--cs-fg-2);font-size:13px}
.todo li.done{opacity:.45}
.todo li.done .tx b{text-decoration:line-through}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--cs-line-strong);background:transparent;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;transition:all .18s ease-out}
.check:hover{border-color:var(--cs-brand)}
.check svg{width:16px;height:16px;opacity:0;color:#fff}
li.done .check{background:#1b8384;border-color:#1b8384}
li.done .check svg{opacity:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--cs-fg-2)}
.kpi .v{font-family:var(--cs-head-font);font-weight:400;font-size:28px;line-height:1.15;margin-top:4px}
.kpi .d{font-size:12.5px;margin-top:2px}
.up{color:var(--cs-brand-text)} .down{color:var(--cs-err)}
.spark{padding:14px 16px 10px;margin-top:12px}
.spark svg{width:100%;height:110px;display:block}

/* Liste */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;min-height:42px;border:1px solid var(--cs-line-strong);background:var(--cs-surface);border-radius:8px;padding:9px 12px 9px 38px;font-size:15px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--cs-fg-2)}
.chip{border:1px solid var(--cs-line-strong);background:var(--cs-surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:#1b8384;border-color:#1b8384;color:#fff}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--cs-fg-2);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--cs-line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--cs-line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s ease-out}
tbody tr:hover{background:var(--cs-bg-soft)}
tbody tr[aria-selected="true"]{background:var(--cs-head)}
tbody tr:last-child td{border-bottom:0}
td .name{font-weight:600}
.empty{padding:36px 16px;text-align:center;display:grid;justify-items:center;gap:8px;color:var(--cs-fg-2)}
.empty .ic{width:96px;height:96px}
.mlist{display:none}

/* Slide-over */
.scrim{position:fixed;inset:0;background:var(--cs-scrim);opacity:0;pointer-events:none;transition:opacity .22s ease-out;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--cs-surface);border-left:1px solid var(--cs-line);box-shadow:var(--cs-shadow);transform:translateX(102%);transition:transform .28s cubic-bezier(.22,1,.36,1);z-index:31;display:flex;flex-direction:column}
.panel{visibility:hidden;transition:transform .28s cubic-bezier(.22,1,.36,1),visibility 0s .28s}
.panel.open{transform:none;visibility:visible;transition-delay:0s}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--cs-line);background:var(--cs-head)}
.panel-h h2{font-size:20px;font-weight:600;font-family:var(--cs-font)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--cs-fg);flex:0 0 auto}
.icon-btn:hover{background:var(--cs-bg-soft)}
.icon-btn svg{width:22px;height:22px}
.panel-b{padding:18px 22px;overflow-y:auto;flex:1}
.dl{display:grid;grid-template-columns:130px 1fr;gap:10px 14px;font-size:14.5px}
.dl dt{color:var(--cs-fg-2)} .dl dd{margin:0;font-weight:500}
.sec-t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cs-fg-2);font-weight:600;margin:22px 0 10px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:flex;gap:10px;font-size:14px}
.timeline li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cs-brand);margin-top:7px;flex:0 0 auto}
.panel-f{padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--cs-line);display:flex;gap:10px;flex-wrap:wrap}

/* Formular */
.form{max-width:680px}
.fsec{padding:20px 22px;margin-bottom:16px}
.fsec h2{font-size:16px;font-weight:600;font-family:var(--cs-font);margin-bottom:4px}
.fsec .hint{font-size:13.5px;color:var(--cs-fg-2);margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-size:13.5px;font-weight:600}
.field label .req{color:var(--cs-err)}
.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--cs-line-strong);background:var(--cs-surface);border-radius:8px;padding:10px 12px;font-size:16px;transition:border-color .15s ease-out}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1b8384;box-shadow:0 0 0 3px rgba(43,182,183,.18)}
.field.err input{border-color:var(--cs-err)}
.field .msg{font-size:13px;color:var(--cs-err);display:none}
.field.err .msg{display:block}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{border:1px solid var(--cs-line-strong);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14.5px;font-weight:500;min-height:42px;display:flex;align-items:center}
.seg label{position:relative}
.seg input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--cs-brand-text)}
.seg label:has(input:checked){border-color:#1b8384;background:var(--cs-mint-bg)}
.factions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.factions .btn-p .ld{width:22px;height:22px;display:none}
.factions .btn-p.busy .ld{display:block}
.factions .btn-p.busy .lbl2{display:none}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--cs-fg);color:var(--cs-bg);border-radius:12px;padding:7px 18px 7px 7px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:14.5px;z-index:40;transition:opacity .22s ease-out,transform .22s ease-out;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ic{width:34px;height:34px;flex:0 0 auto}

/* Drawer (Handy) */
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,86%);background:var(--cs-surface);z-index:33;transform:translateX(-102%);transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 16px;box-shadow:var(--cs-shadow)}
.drawer{visibility:hidden;transition:transform .28s cubic-bezier(.22,1,.36,1),visibility 0s .28s}
.drawer.open{transform:none;visibility:visible;transition-delay:0s}
.todo .mob{display:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--cs-line);margin-bottom:10px}
.dnav{border:0;background:transparent;width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;font-size:15.5px;font-weight:500;cursor:pointer;text-align:left;min-height:48px}
.dnav svg{width:22px;height:22px;color:var(--cs-brand-text)}
.dnav[aria-current="page"]{background:var(--cs-head);color:var(--cs-brand-text)}

[data-view]{display:none}
[data-view].on{display:block}

/* ---- Handy ---- */
@media (max-width:820px){
  .rail{display:none}
  .main{margin-left:0}
  .topbar{display:flex;position:sticky;top:0;z-index:25;height:calc(var(--topbar-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0 16px;align-items:center;justify-content:space-between;background:var(--cs-surface);border-bottom:1px solid var(--cs-line)}
  .topbar .signet{width:auto;height:auto;margin:0;border-radius:0;background:none}
  .topbar .signet img{width:auto;height:34px}
  .topbar .app-n{font-weight:600;font-size:15px;margin-left:10px;flex:1}
  .phead .inner{padding:20px 16px 18px}
  .phead .inner>.btn{width:100%;justify-content:center}
  .content{padding:16px 16px 40px}
  .dash{grid-template-columns:minmax(0,1fr)}
  .todo .desk{display:none}
  .todo .mob{display:inline-flex;margin-bottom:4px}
  .todo{padding:0 4px 6px}
  .todo li{padding:12px 8px}
  .tablewrap table{display:none}
  .mlist{display:block}
  .mrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--cs-line);cursor:pointer}
  .mrow:last-child{border-bottom:0}
  .mrow .tx{flex:1;min-width:0}
  .mrow .tx b{display:block;font-weight:600}
  .mrow .tx small{color:var(--cs-fg-2);font-size:13px}
  .panel{width:100%;border-left:0}
  .frow{grid-template-columns:minmax(0,1fr)}
  .factions .btn{flex:1;justify-content:center}
  .dl{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== App-spezifisch: Offertplattform ===== */
.gdrop{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--cs-brand);background:var(--cs-head);border-radius:12px;padding:16px 18px;margin:6px 0 14px;cursor:pointer;transition:background .15s ease-out,border-color .15s ease-out}
.gdrop:hover,.gdrop.drag{background:#e2f3f4;border-color:#1b8384}
.gdrop b{display:block;font-weight:600;color:var(--cs-brand-text)}
.gdrop small{display:block;color:var(--cs-fg-2);font-size:13px;margin-top:2px}
.gdrop.off{cursor:default;border-color:var(--cs-line-strong);background:var(--cs-bg-soft)}
.gdrop.off b{color:var(--cs-fg-2)}
.grr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--cs-line)}
.grr>input[type=checkbox]{width:20px;height:20px;accent-color:#1b8384;margin-top:10px;flex:0 0 auto}
.grr.off .grr-b{opacity:.5}
.grr-b{flex:1;min-width:0;display:grid;gap:6px}
.grr-l{display:flex;gap:6px;flex-wrap:wrap}
.grr-l input,.grr-l select{min-height:38px;border:1px solid var(--cs-line-strong);border-radius:6px;padding:6px 8px;font-size:15px;background:var(--cs-surface);min-width:0}
.grr-l input:first-child{flex:1 1 140px}
.grr-l select{flex:1 1 160px}
.m2in{display:inline-flex;align-items:center;gap:4px}
.m2in input{width:84px;text-align:right}
.lb{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--cs-fg-2)}
.lb input{width:76px;min-height:36px!important;padding:6px 8px!important;font-size:15px!important}
.pdfbtn .ld{width:22px;height:22px;display:none}.pdfbtn.busy .ld{display:block}.pdfbtn.busy .lbl2{display:none}.pdfbtn .lbl2{display:inline-flex;align-items:center;gap:8px}.pdfbtn .lbl2 svg{width:18px;height:18px}
body{-webkit-tap-highlight-color:transparent}
.nav-i{text-align:center;line-height:1.15}
.two{display:grid;grid-template-columns:minmax(0,680px) minmax(260px,330px);gap:20px;align-items:start}
.sum{position:sticky;top:20px}
.sum .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--cs-line);font-size:14.5px}
.sum .row:last-of-type{border-bottom:0}
.sum .big{font-family:var(--cs-head-font);font-size:30px;font-weight:400;color:var(--cs-brand-text);line-height:1.1}
.sum-b{padding:4px 18px 18px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--cs-warn-bg);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.pipe{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:14px}.pipe-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--cs-line);background:#fff;border-radius:12px;cursor:pointer;font:inherit;color:inherit}.pipe-t .pn{font-size:26px;font-weight:700;line-height:1.1;color:var(--cs-accent,#1b8a8a)}.pipe-t .pl{font-size:13px;font-weight:600}.pipe-t .ps{font-size:11.5px;color:var(--cs-fg-2)}.pipe-t[aria-pressed="true"]{background:var(--cs-accent,#1b8a8a);border-color:var(--cs-accent,#1b8a8a);color:#fff}.pipe-t[aria-pressed="true"] .pn,.pipe-t[aria-pressed="true"] .ps{color:#fff}.pipe-t.warn:not([aria-pressed="true"]){border-color:#d9822b}.pipe-t.warn:not([aria-pressed="true"]) .pn{color:#c0661b}
.offt td,.offt th{padding-left:10px;padding-right:10px}.offt .badge{white-space:nowrap}.nfdots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:6px}.nfdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid #9bb;display:inline-block}.nfdots i.on{background:#1b8a8a;border-color:#1b8a8a}.nfdots i.due{border-color:#d9822b;background:#f6c48d}

const rlOf = t => S.settings.rlTask[t.id] || S.settings.rl[t.cat] || 1000;
function groupMap(code) {
  const out = {};

  const ed = S.settings.groupEdits[code] || {};

  return out;
}
function roomMap(r) { return r.custom || (r.gruppe ? groupMap(r.gruppe) : {}); }
function roomTasks(r) {
  const tex = isTextil(r.boden), out = [];
  Object.entries(roomMap(r)).forEach(([id, raw]) => {
    const t = TASKS[id]; if (!t) return;
    if (t.cat === 'Boden - Textil' && !tex) return;
    if (t.cat === 'Boden - Hartbeläge' && tex) return;
    let code = raw === 'R' ? r.dispo : raw;
    if (code !== 'B' && perYear(code) > perYear(r.dispo)) code = r.dispo;
    const perExec = r.flaeche > 0 ? r.flaeche / rlOf(t) : 0;
    const wk = (code !== 'B' && WEEKLY(code)) ? perExec * parseInt(code) : 0;            // Std. pro Woche
    const per = (code !== 'B' && !WEEKLY(code)) ? perExec * perYear(code) : 0;          // Std. pro Jahr (periodisch)
    const h = (wk * WF() + per / 12) * 12;                                              // Std. pro Jahr gesamt
    out.push({ t, raw, code, h, wk, per, perExec });
  });
  return out.sort((a, b) => ORDER_IDX[a.t.id] - ORDER_IDX[b.t.id]);
}
function roomIssues(r) {
  const e = [];
  if (!r.bez) e.push('Bezeichnung fehlt');
  if (!r.gruppe) e.push('Reinigungsgruppe fehlt');
  if (!r.boden) e.push('Bodenbelag fehlt');
  return e;
}
function roomCalc(r) {
  const ts = roomTasks(r);

  const wk = ts.reduce((a, x) => a + x.wk, 0), per = ts.reduce((a, x) => a + x.per, 0);

}
/* Kalkulation wie bei Clean Service: Std. pro Reinigung × Reinigungen pro Woche × Wochenfaktor × Stundensatz

const WF = () => (S && S.settings && S.settings.wf > 0) ? S.settings.wf : 52 / 12;
function objCalc(o) {
  let wk = 0, per = 0, area = 0, bad = 0;
  o.rooms.forEach(r => { const c = roomCalc(r); wk += c.wk; per += c.per; area += r.flaeche > 0 ? r.flaeche : 0; if (roomIssues(r).length) bad++; });
  const rate = o.rate || S.settings.rate;
  const nWeek = (o.days || []).length || 1;
  const noArea = o.rooms.filter(r => !(r.flaeche > 0)).length;
  const calcPerClean = wk / nWeek;                   // Ø Std. pro Reinigung aus den Flächen
  /* Modus «Einsatz»: Verkäufer schätzt die Stunden pro Reinigung nach Erfahrung (Flächen oft unbekannt).
     Dann gilt: Std. pro Einsatz × Reinigungen pro Woche × Wochenfaktor × Stundensatz. Periodische Arbeiten sind darin enthalten. */
  const einsatz = o.stdEinsatz > 0;

  const perClean = einsatz ? o.stdEinsatz : calcPerClean;

  const monthHoursPer = per / 12;                    // periodische Arbeiten pro Monat
  const monthHours = monthHoursWeekly + monthHoursPer;
  const hours = monthHours * 12;
  const calcMonthly = monthHours * rate;
  const base = o.pauschale > 0 ? o.pauschale : calcMonthly;
  const wash = o.wasch && o.waschPreis > 0 ? +o.waschPreis : 0;      // Tücherservice, monatlich
  const fenster = o.fenster && o.fensterPreis > 0 ? +o.fensterPreis : 0;  // Fensterreinigung pauschal pro Ausführung (nicht im Monatsbetrag)

  return { hours, area, bad, noArea, rate, wk, per, nWeek, perClean, calcPerClean, einsatz, mode, monthHoursWeekly, monthHoursPer, monthHours, wf: WF(), calcMonthly, base, wash, fenster, monthly, annual: monthly * 12, perWeek: wk };
}

  const all = S.objects.filter(x => OPEN_BES.includes(x.status)).sort((a, b) => (a.besDatum + a.besZeit).localeCompare(b.besDatum + b.besZeit));
  const canc = S.objects.filter(x => x.status === 'abgesagt').sort((a, b) => (b.besDatum + b.besZeit).localeCompare(a.besDatum + a.besZeit)).slice(0, 8);
  const cancHtml = canc.length ? `<div class="card" style="margin-top:16px"><div class="card-h"><h2>Abgesagt</h2><span class="small muted">Neu planen, falls ein neuer Termin vereinbart wird</span></div>${canc.map(x => { const cu = custOf(x); return `<div class="agr"><div class="agt"><b>${esc(x.besZeit || '–')}</b><small>${fmtDay(x.besDatum)}</small></div><div class="tx"><b>${esc(cu.firma || 'Kunde')}</b><small class="muted">${esc(x.adresse || '–')}${x.verkaeufer ? ' · ' + esc(x.verkaeufer) : ''}</small></div><div class="agx"><span class="badge b-err">Abgesagt</span><button class="btn btn-p btn-sm" data-act="editPlan" data-id="${x.id}">Neu planen</button></div></div>`; }).join('')}</div>` : '';
  if (!all.length) return cancHtml;
  const dayTitle = d => { if (d < today) return 'Überfällig'; if (d === today) return 'Heute'; if (d === tomorrow) return 'Morgen'; return parseDay(d).toLocaleDateString('de-CH', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }); };
  const groups = []; all.forEach(x => { const key = x.besDatum < today ? '0000-overdue' : x.besDatum; let g = groups.find(g => g.key === key); if (!g) { g = { key, title: dayTitle(x.besDatum), items: [] }; groups.push(g); } g.items.push(x); });
  const row = x => { const cu = custOf(x), late = x.besDatum < today && x.status === 'geplant';
    return `<div class="agr" data-act="openBes" data-id="${x.id}" tabindex="0" aria-selected="${UI.cur === x.id}">
      <div class="agt"><b>${esc(x.besZeit || '–')}</b><small>${x.besDatum < today || x.besDatum > tomorrow ? fmtDay(x.besDatum) : 'Uhr'}</small></div>

      <div class="agx">${late ? '<span class="badge b-warn">Überfällig</span>' : badge(x.status)}<button class="btn btn-g btn-sm" data-act="editPlan" data-id="${x.id}" title="Termin, Verkäufer oder Angaben ändern. Der Kalender wird automatisch angepasst.">Bearbeiten</button><button class="btn ${x.status === 'erfassung' ? 'btn-s' : 'btn-p'} btn-sm" data-act="${x.status === 'erfassung' ? 'openBes' : 'startBes'}" data-id="${x.id}">${x.status === 'erfassung' ? 'Weiter' : 'Starten'}</button></div></div>`; };

}

/* Signatur */
function initSig(o, locked) {
  const cv = $('#sig'); if (!cv) return;
  const fit = () => { const r = cv.getBoundingClientRect(); if (!r.width) return; const dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#3c3c3b';
    if (o.signature && med(o.signature)) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = med(o.signature); } };
  requestAnimationFrame(fit);
  if (locked) return;
  let drawing = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e), ctx = cv.getContext('2d'); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; });
  const end = () => { if (!drawing) return; drawing = false; const cur = objOf(o.id); if (!cur) return; cur.signature = mediaPut(cv.toDataURL('image/png'), 'sig-' + o.id); save(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

async function loadPdfPreview(o, lang) {
  const host = $('#pdfPrev'); if (!host) return; const tok = ++PV.tok;
  const msg = t => { if (tok === PV.tok && $('#pdfPrev')) $('#pdfPrev').innerHTML = `<div class="pvmsg">${t}</div>`; };
  try {
    if (!window.PDFLib || !window.pdfjsLib) throw new Error('lib');
    const key = lang + JSON.stringify([o, S.customers.find(c => c.id === o.customerId)]);
    if (PV.key !== key || !PV.bytes) { const doc = await buildOfferPdf(o, lang); PV.bytes = await doc.save(); PV.key = key; }
    if (tok !== PV.tok || !$('#pdfPrev')) return;
    const pdf = await pdfjsLib.getDocument({ data: PV.bytes.slice(), isEvalSupported: false }).promise;
    if (tok !== PV.tok || !$('#pdfPrev')) return;
    const h = $('#pdfPrev'); h.innerHTML = '';
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && !e.target._done) { e.target._done = true; io.unobserve(e.target); e.target._draw(); } }), { rootMargin: '600px 0px' });
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1 });
      const wrap = document.createElement('div'); wrap.className = 'pg'; wrap.style.aspectRatio = vp.width + ' / ' + vp.height;
      const cv = document.createElement('canvas'); wrap.appendChild(cv);
      const tag = document.createElement('span'); tag.className = 'pgn'; tag.textContent = `Seite ${i} von ${pdf.numPages}`; wrap.appendChild(tag);
      wrap._draw = async () => { const w = Math.min(wrap.clientWidth || 800, 900), sc = w / vp.width * Math.min(window.devicePixelRatio || 1, 2), v = page.getViewport({ scale: sc });
        cv.width = Math.round(v.width); cv.height = Math.round(v.height); try { await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise; } catch (e) {} };
      h.appendChild(wrap); io.observe(wrap);
    }
  } catch (e) { msg(`${ico('i-warn')}<span>Vorschau nicht möglich${e && e.message && e.message !== 'lib' ? ': ' + esc(e.message) : ''}. Mit «PDF-Offerte ansehen» oben öffnest du das PDF direkt.</span>`); }
}

  } else if (!window.claude) {

/* ---------- Bilder vorbereiten ---------- */
function canvasToBlob(cv, q = .86) { return new Promise(r => cv.toBlob(b => r(b), 'image/jpeg', q)); }
function scaleCanvas(src, maxSide) {
  const s = Math.min(1, maxSide / Math.max(src.width, src.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(src.width * s); cv.height = Math.round(src.height * s);
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(src, 0, 0, cv.width, cv.height); return cv;
}
async function fileToCanvases(file) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    if (!window.pdfjsLib) throw { code: 'pdf_lib' };
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
    const out = [];
    for (let i = 1; i <= Math.min(pdf.numPages, 6); i++) {
      const page = await pdf.getPage(i); const v0 = page.getViewport({ scale: 1 });
      const scale = Math.min(4, 3200 / Math.max(v0.width, v0.height)); const vp = page.getViewport({ scale });
      const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      out.push({ name: `${file.name} · Seite ${i}`, cv });
    }
    return out;
  }
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight; cv.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(url);
  return [{ name: file.name, cv: scaleCanvas(cv, 3200) }];
}
/* Übersicht + 2×2 Kacheln mit Überlappung, damit kleine Beschriftungen lesbar bleiben */
async function planImages(cv, maxCount) {
  const imgs = [await canvasToBlob(scaleCanvas(cv, 1600))];
  if (maxCount >= 5) {
    const ov = 0.12, w = cv.width, h = cv.height, tw = Math.round(w * (0.5 + ov)), th = Math.round(h * (0.5 + ov));
    for (const [x, y] of [[0, 0], [w - tw, 0], [0, h - th], [w - tw, h - th]]) {
      const t = document.createElement('canvas'); t.width = tw; t.height = th; t.getContext('2d').drawImage(cv, x, y, tw, th, 0, 0, tw, th);
      imgs.push(await canvasToBlob(scaleCanvas(t, 1600)));
    }
  }
  return imgs;
}

- bez: Raumbezeichnung wie im Plan (Deutsch), sonst sinnvolle Bezeichnung nach Nutzung
- nr: Raumnummer aus dem Plan oder ""
- flaeche: Fläche in m² als Zahl. Wenn im Plan eine Fläche steht, diese nehmen (quelle "plan"). Wenn Masse/Massstab vorhanden sind, berechnen (quelle "berechnet"). Sonst grob schätzen anhand typischer Proportionen (quelle "geschätzt"). Wenn unmöglich: null (quelle "fehlt").
- quelle: "plan" | "berechnet" | "geschätzt" | "fehlt"
- gruppe: passendster Code aus dieser Liste von Reinigungsgruppen: ${groups}. Büros: 2.10, WC: 7.10, Korridor: 9.20, Treppe: 9.22.
- boden: einer aus ${BODEN.map(b => b[0]).join(', ')} nur wenn im Plan angegeben, sonst null
- konfidenz: 0 bis 1, wie sicher die Erkennung des Raums und der Fläche ist
Zusätzlich: stockwerk = eines aus ${FLOORS.join(', ')} wenn aus dem Plan ersichtlich, sonst null; hinweis = ein kurzer Satz zu Unsicherheiten (Deutsch, Schweizer Schreibweise mit ss).

Antworte nur mit JSON in genau dieser Form:
{"stockwerk":"EG","hinweis":"...","raeume":[{"bez":"Büro","nr":"101","flaeche":24.5,"quelle":"plan","gruppe":"2.10","boden":null,"konfidenz":0.9}]}`;
}

/* ---------- Ablauf ---------- */
let grCtl = null;
async function grStart(files) {
  if (!grAvailable()) { toast('Grundriss-Erkennung ist in dieser Ansicht nicht verfügbar', 'info'); return; }
  const o = curObj(); if (!o) return;
  UI.gr = { status: 'prep', oid: o.id, pages: [], msg: '' };
  openPanel({ type: 'gr', id: 'gr' });
  try {
    for (const f of files) {
      const cvs = await fileToCanvases(f);
      for (const p of cvs) UI.gr.pages.push({ name: p.name, cv: p.cv, thumb: scaleCanvas(p.cv, 700).toDataURL('image/jpeg', .72), result: null, err: null });
    }
  } catch (e) {
    UI.gr.status = 'error'; UI.gr.msg = e && e.code === 'pdf_lib' ? 'Das PDF-Modul konnte nicht geladen werden. Bitte Seite neu laden oder den Plan als Bild (JPG/PNG) hochladen.' : 'Die Datei konnte nicht gelesen werden. Bitte ein PDF, JPG oder PNG verwenden.';
    renderPanel(); return;
  }
  if (!UI.gr.pages.length) { UI.gr.status = 'error'; UI.gr.msg = 'Keine Seite gefunden.'; renderPanel(); return; }
  UI.gr.status = 'run'; renderPanel();
  grCtl = new AbortController();
  for (let i = 0; i < UI.gr.pages.length; i++) {
    const pg = UI.gr.pages[i]; UI.gr.cur = i; renderPanel(true);
    try {
      const imgs = await planImages(pg.cv, SAMPLE_IMG.maxCount || 1);
      const res = await SAMPLE.json(grPrompt(imgs.length, pg.name), { images: imgs, signal: grCtl.signal, modelTier: 'default' });
      const floor = FLOORS.includes(res && res.stockwerk) ? res.stockwerk : (UI.floor !== 'Alle' ? UI.floor : 'EG');
      pg.floor = floor; pg.hinweis = (res && res.hinweis) || '';
      pg.result = (Array.isArray(res && res.raeume) ? res.raeume : []).map(r => {
        const g = GROUP[String(r.gruppe || '').trim()] ? String(r.gruppe).trim() : '';
        const fl = Number(r.flaeche); const k = Math.max(0, Math.min(1, Number(r.konfidenz) || 0));
        return { use: k >= 0.4, bez: String(r.bez || '').slice(0, 60), nr: String(r.nr || '').slice(0, 12), flaeche: fl > 0 ? Math.round(fl * 10) / 10 : null,
          quelle: ['plan', 'berechnet', 'geschätzt'].includes(r.quelle) && fl > 0 ? r.quelle : 'fehlt', gruppe: g, boden: BODEN.some(b => b[0] === r.boden) ? r.boden : '', konfidenz: k };
      });
    } catch (e) {
      if (e && e.code === 'cancelled') { UI.gr.status = 'error'; UI.gr.msg = 'Erkennung abgebrochen.'; renderPanel(); return; }
      if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'images_unavailable')) { SAMPLE_IMG = null; UI.gr.status = 'error'; UI.gr.msg = 'Die Grundriss-Erkennung wurde nicht erlaubt oder ist für dieses Konto nicht verfügbar.'; renderPanel(); refreshBesLive(); return; }
      pg.err = { invalid_json: 'Die Antwort war unvollständig. Bitte nochmals versuchen.', rate_limited: 'Zu viele Anfragen. Bitte in ein paar Minuten nochmals versuchen.', image_rejected: 'Das Bild wurde abgelehnt (zu gross oder unlesbar).', refused: 'Dieser Plan konnte nicht ausgewertet werden.' }[e && e.code] || 'Die Erkennung ist fehlgeschlagen. Bitte nochmals versuchen.';
      pg.result = [];
    }
  }
  UI.gr.status = 'review'; renderPanel();
}
function grPanelHtml() {
  const g = UI.gr; if (!g) return '';
  const head = (t, sub) => `<div class="panel-h"><div><div class="eyebrow">Grundriss-Erkennung</div><h2 id="panelTitle">${t}</h2><p class="small muted" style="margin-top:4px">${sub}</p></div><button class="icon-btn" data-act="grClose" aria-label="Schliessen"><svg><use href="#i-x"/></svg></button></div>`;
  if (g.status === 'prep' || g.status === 'run') {
    const n = g.pages.length, i = (g.cur || 0) + 1;
    return head(g.status === 'prep' ? 'Plan wird vorbereitet' : 'Claude liest den Grundriss', g.status === 'run' ? `Plan ${i} von ${n}. Das dauert meist 20 bis 60 Sekunden pro Plan.` : 'Seiten werden gerendert.') +
      `<div class="panel-b"><div class="empty"><div class="ic" data-lottie="${g.status === 'run' ? 'search' : 'loader'}" aria-hidden="true"></div><p>${g.status === 'run' ? 'Räume, Nummern und Flächen werden erkannt …' : 'Wird vorbereitet …'}</p></div>
      ${g.pages.map(p => `<img src="${p.thumb}" alt="${esc(p.name)}" style="width:100%;border:1px solid var(--cs-line);border-radius:10px;margin-bottom:10px">`).join('')}</div>
      <div class="panel-f">${g.status === 'run' ? '<button class="btn btn-s" data-act="grStop">Abbrechen</button>' : ''}</div>`;
  }
  if (g.status === 'error') return head('Nicht möglich', g.msg) + `<div class="panel-b"><div class="empty"><div class="ic" data-lottie="error" aria-hidden="true"></div><p>${esc(g.msg)}</p></div></div><div class="panel-f"><button class="btn btn-p" data-act="grClose" style="margin-left:auto">Schliessen</button></div>`;
  const total = g.pages.reduce((a, p) => a + (p.result || []).filter(r => r.use).length, 0);
  const qBadge = q => ({ plan: '<span class="badge b-ok">aus Plan</span>', berechnet: '<span class="badge b-info">berechnet</span>', 'geschätzt': '<span class="badge b-warn">geschätzt</span>', fehlt: '<span class="badge b-err">Fläche fehlt</span>' })[q];
  return head('Vorschlag prüfen', 'Nur angehakte Räume werden übernommen. Geschätzte Flächen bitte vor Ort kontrollieren.') + `<div class="panel-b">
    ${g.pages.map((p, pi) => `<div style="margin-bottom:18px">
      <img src="${p.thumb}" alt="${esc(p.name)}" style="width:100%;border:1px solid var(--cs-line);border-radius:10px">
      <div class="frow" style="margin-top:10px"><div class="field"><label for="grF${pi}">Stockwerk</label><select id="grF${pi}" data-grf="${pi}">${FLOORS.map(f => `<option ${f === p.floor ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
        <div class="field"><label>Erkannt</label><div style="padding:10px 0;font-weight:600">${(p.result || []).length} Räume · ${fmtN((p.result || []).reduce((a, r) => a + (r.flaeche || 0), 0), 1)} m²</div></div></div>
      ${p.err ? `<div class="warnbox">${ico('i-warn')}<div>${esc(p.err)}</div></div>` : ''}
      ${p.hinweis ? `<div class="infobox" style="margin-bottom:8px">${ico('i-info')}<div>${esc(p.hinweis)}</div></div>` : ''}
      ${(p.result || []).map((r, ri) => `<div class="grr ${r.use ? '' : 'off'}">
        <input type="checkbox" data-gru="${pi}:${ri}" ${r.use ? 'checked' : ''} aria-label="${esc(r.bez)} übernehmen">
        <div class="grr-b">
          <div class="grr-l"><input data-grv="${pi}:${ri}:bez" value="${esc(r.bez)}" aria-label="Bezeichnung"><input data-grv="${pi}:${ri}:nr" value="${esc(r.nr)}" placeholder="Nr." aria-label="Nummer" style="max-width:76px">
            <span class="m2in"><input data-grv="${pi}:${ri}:flaeche" inputmode="decimal" value="${r.flaeche ?? ''}" placeholder="0.0" aria-label="Fläche"><span>m²</span></span></div>
          <div class="grr-l"><select data-grv="${pi}:${ri}:gruppe" aria-label="Reinigungsgruppe"><option value="">Gruppe wählen</option>${GROUPS.map(x => `<option value="${x.code}" ${x.code === r.gruppe ? 'selected' : ''}>${x.code} ${esc(x.name)}</option>`).join('')}</select>
            <select data-grv="${pi}:${ri}:boden" aria-label="Bodenbelag"><option value="">Boden …</option>${BODEN.map(([b]) => `<option ${b === r.boden ? 'selected' : ''}>${b}</option>`).join('')}</select></div>
          <div class="small muted" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${qBadge(r.quelle)}<span>Sicherheit ${Math.round(r.konfidenz * 100)} %</span></div>
        </div></div>`).join('')}
    </div>`).join('')}
  </div>
  <div class="panel-f"><button class="btn btn-g" data-act="grClose">Verwerfen</button><button class="btn btn-p" data-act="grApply" style="margin-left:auto" ${total ? '' : 'disabled'}>${ico('i-ok')}${total} ${total === 1 ? 'Raum' : 'Räume'} übernehmen</button></div>`;
}
function grApply() {
  const g = UI.gr, o = objOf(g.oid); if (!o) return;
  const d = defaultDispo(o); let n = 0;
  g.pages.forEach(p => (p.result || []).filter(r => r.use).forEach(r => {
    let gr = r.gruppe; if (FAMILIES[gr] && FAMILY_BY[FAMILIES[gr]][d]) gr = FAMILY_BY[FAMILIES[gr]][d];
    o.rooms.push({ id: uid(), floor: p.floor, bez: r.bez || 'Raum', nr: r.nr || '', gruppe: gr, flaeche: r.flaeche, boden: r.boden || '', dispo: d, custom: null,
      notiz: r.quelle === 'plan' ? '' : r.quelle === 'fehlt' ? 'Fläche vor Ort messen' : `Fläche ${r.quelle}, vor Ort prüfen`, photos: [], quelle: 'grundriss' });
    n++;
  }));
  // Plan als Skizze ablegen
  g.pages.forEach(p => o.skizze.push(mediaPut(scaleCanvas(p.cv, 1400).toDataURL('image/jpeg', .7))));
  logO(o, `${n} Räume aus Grundriss übernommen`);
  UI.gr = null; save(); closePanel(true); UI.floor = 'Alle'; renderBes();
  toast(`${n} Räume ins Raumbuch übernommen`, 'check');
}

/* Drag & Drop auf die Ablagefläche */
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('#gdrop'); if (!z || z.classList.contains('off')) return; e.preventDefault(); z.classList.add('drag'); }));
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#gdrop'); if (z) z.classList.remove('drag'); });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#gdrop'); if (!z) return; e.preventDefault(); z.classList.remove('drag'); if (z.classList.contains('off')) return; const f = [...(e.dataTransfer?.files || [])]; if (f.length) grStart(f); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'gdrop') { e.preventDefault(); e.target.click(); } });


/* Start */
boot();
window.addEventListener('load', () => hydrateIcons());
</script>
